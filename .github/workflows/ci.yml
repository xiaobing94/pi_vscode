name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pi, the extension and the shadow-Git tests are developed against Windows first.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Verify the extension packages cleanly
        run: npx --yes @vscode/vsce package --no-dependencies --out pi-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: pi-vscode.vsix
          if-no-files-found: error
